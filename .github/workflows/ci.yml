# Flox-only CI: the manifest is the sole toolchain provider and the gate job
# runs exactly what `make validate` runs locally — CI cannot drift from the
# local gate. Network-dependent supply-chain audits live in audit.yml.
name: ci

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # scripts/validate compares Buf schemas against the newest reachable
          # release tag, so the gate needs full history and tags to check
          # exactly what it checks on a maintainer's machine.
          fetch-depth: 0
      - uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3
        with:
          disable-metrics: "true"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/flox
          key: flox-${{ runner.os }}-${{ hashFiles('.flox/env/manifest.lock') }}
      - name: Run the gate
        env:
          FLOX_DISABLE_METRICS: "true"
        run: flox activate -- make validate
