# Weekly network-dependent supply-chain audits: dependency/vulnerability
# scans, the Git history secret scan, and Git-SHA installability of every SDK.
# These are deliberately outside `make validate` — the gate stays
# deterministic and lockfile-driven — and this workflow is exactly the same
# secretless Flox skeleton as ci.yml, running one make verb.
name: audit

"on":
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full Git history, and the Git-SHA install
          # checks package HEAD from a local bare origin.
          fetch-depth: 0
      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2.6.0
        with:
          disable-metrics: "true"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flox
          key: flox-${{ runner.os }}-${{ hashFiles('.flox/env/manifest.lock') }}
      - name: Run the audits
        env:
          FLOX_DISABLE_METRICS: "true"
        run: flox activate -- make audit
