version: v2
modules:
  - path: api
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
    # Comments are part of the public contract: every service, RPC, message,
    # and field published from this module must carry documentation.
    - COMMENT_SERVICE
    - COMMENT_RPC
    - COMMENT_MESSAGE
    - COMMENT_FIELD
  except:
    # inspection.proto shares the temporaless.v1 package but generates its Go
    # messages and gRPC stubs into a sibling package, so the record package
    # never links a transport (see the go_package comment in that file).
    - PACKAGE_SAME_GO_PACKAGE
breaking:
  use:
    - FILE
