[project]
name = "temporaless-dagster-boundary-test"
version = "0.0.0"
description = "Development-only process-isolated Dagster application-RPC compatibility test."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tests/gen", "tests/server_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP047"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/gen"]

[dependency-groups]
dev = [
    "connectrpc==0.11.1",
    "dagster==1.13.17",
    "protobuf==6.33.6",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "types-protobuf>=6.32.1.20260221,<7",
]
